<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Server address</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
        color: #000;
        font-family: "Myriad Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      form {
        padding: 20px 24px;
        display: grid;
        gap: 12px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 15px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #000;
        padding: 8px 10px;
        font: inherit;
        font-size: 15px;
      }
      .hint {
        margin: 0;
        font-size: 13px;
        color: #555;
      }
      .row {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        border: 1px solid #000;
        background: #fff;
        color: #000;
        font: inherit;
        font-size: 14px;
        padding: 6px 14px;
        cursor: pointer;
      }
      button:hover {
        background: #eee;
      }
    </style>
  </head>
  <body>
    <form id="form">
      <label>
        Server address
        <input id="url" type="text" autofocus spellcheck="false" />
      </label>
      <p class="hint">Example: <code>http://192.168.1.20:5173/</code> for a server on another machine.</p>
      <div class="row">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit">Connect</button>
      </div>
    </form>
    <script>
      const input = document.getElementById('url')
      input.value = new URLSearchParams(location.search).get('url') || ''
      input.select()
      document.getElementById('form').addEventListener('submit', (event) => {
        event.preventDefault()
        window.shellAddress.save(input.value)
      })
      document.getElementById('cancel').addEventListener('click', () => window.shellAddress.cancel())
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') window.shellAddress.cancel()
      })
    </script>
  </body>
</html>
