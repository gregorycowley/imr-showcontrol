<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Show Control</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #fff;
        color: #000;
        font-family: "Myriad Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      main {
        border: 1px solid #000;
        padding: 32px 40px;
        max-width: 560px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 400;
      }
      p {
        margin: 0 0 8px;
        font-size: 15px;
        line-height: 1.5;
      }
      code {
        font-family: Menlo, Consolas, monospace;
        font-size: 14px;
      }
      .dots::after {
        content: "";
        animation: dots 1.5s steps(4, end) infinite;
      }
      @keyframes dots {
        to {
          content: "…";
        }
      }
      .muted {
        color: #555;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Waiting for the Show Control server<span class="dots"></span></h1>
      <p>Looking for <code id="target"></code></p>
      <p class="muted">Start the server in the project folder with <code>npm run dev</code>. This window loads the interface as soon as it answers.</p>
      <p class="muted">Wrong address? Use Server &gt; Change Server Address… (⌘L).</p>
    </main>
    <script>
      const target = new URLSearchParams(location.search).get('target') || ''
      document.getElementById('target').textContent = target
    </script>
  </body>
</html>
